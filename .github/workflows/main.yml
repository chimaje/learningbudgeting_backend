name: Continuous Integration and Automatic Testing

on:
  push:
    branches: 
        - main
        - 'feature/**'
        - 'bugfix/**'
        - 'update/**'
        - 'hotfix/**'
        - '**'
  pull_request:
    branches: [ main ]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '21'
                cache: maven

            - name: Build with Maven
              run: mvn -B -DskipTests package

    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '21'
                cache: maven

            - name: Run tests
              run: mvn -B test

    